<body>
    <div id="root">
        <section class="earth-hero boot">
            <h1>Oficina de Gestão Ambiental</h1>
            <p class="lead">Carregando…</p>
        </section>
    </div>
    <noscript>
        <p style="padding:24px;color:#fff;font:16px/1.5 sans-serif">
            Este site precisa de JavaScript para funcionar. Ative o JavaScript no navegador e recarregue a página.
        </p>
    </noscript>

    <script>
        window.addEventListener("load", function () {
            setTimeout(function () {
                var root = document.getElementById("root");
                if (root && root.querySelector(".boot")) {
                    root.innerHTML = '<p style="padding:24px;color:#fff;font:16px/1.5 sans-serif">Não foi possível carregar a página. Atualize o navegador e <a href="" style="color:#fff">tente de novo</a>.</p>';
                }
            }, 4000);
        });
    </script>
</body>
